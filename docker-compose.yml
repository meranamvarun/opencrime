version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opencrime
      POSTGRES_PASSWORD: opencrime
      POSTGRES_DB: opencrime
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencrime"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://opencrime:opencrime@db:5432/opencrime
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - uploads:/tmp/opencrime/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.processing.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://opencrime:opencrime@db:5432/opencrime
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app
      - uploads:/tmp/opencrime/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  crawler-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.crawler.tasks.celery_app worker --loglevel=info --concurrency=4 -Q crawler
    environment:
      DATABASE_URL: postgresql://opencrime:opencrime@db:5432/opencrime
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CRAWLER_PROXY_URLS: ${CRAWLER_PROXY_URLS:-}
    volumes:
      - ./backend:/app
      - uploads:/tmp/opencrime/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  crawler-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.crawler.scheduler.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://opencrime:opencrime@db:5432/opencrime
      REDIS_URL: redis://redis:6379/0
      CRAWLER_PROXY_URLS: ${CRAWLER_PROXY_URLS:-}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
